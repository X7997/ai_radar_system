name: 每日 AI Radar 自动化云端工作流

on:
  schedule:
    # 每天世界协调时 UTC 23:30 (即北京时间 CST 07:30) 准时自动执行
    - cron: '30 23 * * *'
  workflow_dispatch: # 支持在 GitHub 控制台界面手动一键触发

jobs:
  run-radar-script:
    name: 执行早报嗅探提炼与同步
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v3
      
    - name: 配置 Python 3.10 运行时
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: 安装 Python 依赖与 Playwright 浏览器组件
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
        
    - name: 执行 AI Radar 自动化主脚本
      working-directory: backend
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        GITHUB_GIST_TOKEN: ${{ secrets.MY_GIST_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
        XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
      run: python main.py
