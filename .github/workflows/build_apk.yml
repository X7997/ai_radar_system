name: 构建 Android 桌面小组件 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: 自动化打包编译 Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v3

    - name: 配置 JDK 17 编译环境
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 赋予 gradlew 执行权限
      working-directory: android
      run: chmod +x ./gradlew || echo "未找到 gradlew，使用系统环境默认 Gradle。"
      
    - name: 初始化 Gradle 构建缓存
      uses: gradle/gradle-build-action@v2
      
    - name: 执行 Gradle 编译打包 (assembleDebug)
      working-directory: android
      run: ./gradlew assembleDebug || gradle assembleDebug

    - name: 上传 APK 构建产物 (Artifact)
      uses: actions/upload-artifact@v3
      with:
        name: AI-Radar-桌面小组件-Debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
